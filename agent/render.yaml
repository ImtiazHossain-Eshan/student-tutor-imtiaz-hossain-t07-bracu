# Render Blueprint for the CSE110 Tutor Agent (free web service, Docker).
# Deploy from a PRIVATE repository that contains this agent folder with its built index/.
services:
  - type: web
    name: cse110-tutor
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false            # paste in the Render dashboard; never commit it
      - key: GOOGLE_API_KEY
        sync: false
      - key: TUTOR_ALLOWED_ORIGINS
        value: https://st-imtiaz-t07.vercel.app
      - key: TUTOR_LIMIT_PER_MINUTE
        value: "5"
      - key: TUTOR_LIMIT_PER_DAY
        value: "40"
      - key: TUTOR_GLOBAL_PER_DAY
        value: "800"
